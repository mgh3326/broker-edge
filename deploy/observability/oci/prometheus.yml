global:
  scrape_interval: 30s
  external_labels:
    machine_id: oci
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: {machine_id: oci}
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: {machine_id: oci}
